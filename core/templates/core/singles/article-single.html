{% extends 'core/base.html' %}

{% block main %}

<div class="grid">
    <div class="grid-left">
        <div class="menu-navigator">
            {% include "core/includes/category-sidebar-list.html" %}


        </div>
    </div>

    <div class="grid-right">
        <div class="grid-right-wraper">
            <article class="single-article">
                 {% include "core/includes/post-taxonomy.html" with record=article record_type=workspace_record_type %}
                        <h1 class="article-title">{{article.title}}</h1>
                 <a class="edit-record-btn" href="{% url 'article_edit' request.user.username article.slug %}" aria-label="Edit Article" title="Edit Article"><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i></a>
                 <div class="article-content">
                    {{article.content | safe  }}
                 </div>

            </article>





        </div>


    </div>

</div>


{% endblock %}
