<div class="language-selector notranslate" aria-label="Website language selector">
    <div class="language-flags" role="group" aria-label="Choose website language">
        <button class="language-flag" type="button" data-language="en" aria-label="English" title="English">
            <span aria-hidden="true">🇬🇧</span>
        </button>
        <button class="language-flag" type="button" data-language="el" aria-label="Greek" title="Ελληνικά">
            <span aria-hidden="true">🇬🇷</span>
        </button>
    </div>
    <div id="google_translate_element" aria-hidden="true"></div>
</div>
